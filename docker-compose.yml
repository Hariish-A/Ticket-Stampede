name: ticket-stampede

x-seller: &seller
  build:
    context: ./seller
    target: runtime
  environment:
    # DB_HOST=toxiproxy DB_PORT=5433 routes the seller through the fault injector
    # (scripts/slowdb.sh); by default it talks to postgres directly.
    DATABASE_URL: postgresql://tickets:tickets@${DB_HOST:-postgres}:${DB_PORT:-5432}/tickets
    ALLOCATOR: ${ALLOCATOR:-skiplocked}
    POOL_MIN: ${POOL_MIN:-5}
    POOL_MAX: ${POOL_MAX:-20}
    POOL_ACQUIRE_TIMEOUT: ${POOL_ACQUIRE_TIMEOUT:-1.0}
    COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-2.0}
    MAX_INFLIGHT: ${MAX_INFLIGHT:-0}
  depends_on:
    postgres:
      condition: service_healthy
    toxiproxy:
      condition: service_started
  restart: unless-stopped
  cap_add:
    - SYS_PTRACE  # lets py-spy attach to the server process (scripts/profile.sh)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    # fsync and synchronous_commit are the defaults; stated explicitly because
    # "a confirmed sale survives a crash" (TF2) depends on them.
    command: ["postgres", "-c", "max_connections=200", "-c", "fsync=on", "-c", "synchronous_commit=on"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Come back after a Docker Desktop restart (it didn't, in M3, and seller1 crash-looped).
    # M7 (kill the datastore) must check this policy does not auto-restart a killed postgres.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Fault injector between the sellers and Postgres (M6): the buyer adds and
  # removes toxics through its API on :8474 to make the datastore slow on cue.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  seller1:
    <<: *seller
    ports:
      - "${SELLER1_PORT:-8001}:8000"  # host port only for manual curl; the buyer uses the compose network

  # TF1 (M8): two more identical instances. No host ports -- reach them via lb.
  seller2:
    <<: *seller
  seller3:
    <<: *seller

  # nginx: load balancer over seller1-3 on :8080 (M8); client-calibration target
  # on :8081 (M3). nginx resolves the seller hostnames once, at startup. A
  # recreated seller that comes back on a *different* IP would be unreachable
  # until lb restarts. (Tested in M8: Docker reused the same IP, so it did not
  # bite; the scripts restart lb after recreating sellers anyway, as insurance.)
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: 65535
    ports:
      - "${LB_PORT:-8080}:8080"
    depends_on:
      seller1:
        condition: service_healthy
      seller2:
        condition: service_healthy
      seller3:
        condition: service_healthy

  # Allocator integration tests against the real Postgres.
  seller-tests:
    build:
      context: ./seller
      target: test
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://tickets:tickets@postgres:5432/tickets
    depends_on:
      postgres:
        condition: service_healthy

  # The load client. Not started by `docker compose up`; run it with
  # `docker compose run --rm buyer run ...`. It lives on the compose network so
  # Docker Desktop's host port-forwarding is not in the measured path (Plan.md D10).
  buyer:
    build: ./buyer
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./results:/app/results
    depends_on:
      seller1:
        condition: service_healthy

volumes:
  pgdata:
